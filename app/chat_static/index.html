<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f7f4ef;
            color: #1f2933;
        }

        .app {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            max-width: 920px;
            margin: 0 auto;
            background: #fffdf9;
            border-left: 1px solid #e5ded2;
            border-right: 1px solid #e5ded2;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid #e9e2d8;
            background: #fffaf2;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select,
        button,
        textarea {
            font: inherit;
        }

        select {
            height: 36px;
            border: 1px solid #cfc7bb;
            background: #fff;
            border-radius: 6px;
            padding: 0 10px;
        }

        .link {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .nav-button {
            height: 34px;
            border: 1px solid #cfc7bb;
            border-radius: 6px;
            background: #fff;
            color: #1f2933;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 0 10px;
        }

        .messages {
            overflow-y: auto;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: min(76%, 680px);
            padding: 11px 13px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .message.user {
            align-self: flex-end;
            background: #dbeafe;
            color: #172554;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f1f5f9;
            color: #111827;
        }

        .composer {
            padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
            border-top: 1px solid #e9e2d8;
            background: #fffaf2;
            position: sticky;
            bottom: 0;
            z-index: 2;
        }

        .attachments {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 26px;
            margin-bottom: 8px;
            color: #667085;
            font-size: 0.88rem;
        }

        .input-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: end;
        }

        textarea {
            min-height: 46px;
            max-height: 160px;
            resize: vertical;
            border: 1px solid #cfc7bb;
            border-radius: 8px;
            padding: 11px 12px;
            background: #fff;
            line-height: 1.35;
            font-size: 16px;
        }

        button {
            height: 46px;
            border: 1px solid #2563eb;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            padding: 0 14px;
            cursor: pointer;
        }

        button.secondary {
            border-color: #cfc7bb;
            background: #fff;
            color: #1f2933;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            min-height: 20px;
            margin-top: 8px;
            color: #667085;
            font-size: 0.88rem;
        }

        @media (max-width: 640px) {
            .app {
                border: 0;
            }

            header {
                padding: 12px 14px;
            }

            nav {
                justify-content: flex-end;
            }

            .messages {
                padding: 14px 12px;
                gap: 10px;
            }

            .message {
                max-width: 92%;
                padding: 10px 12px;
            }

            .composer {
                padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
            }

            .input-row {
                grid-template-columns: 76px minmax(0, 1fr) 70px;
                gap: 6px;
            }

            button {
                padding: 0 10px;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Calorie Tracker</h1>
            <nav>
                <button class="nav-button" type="button" id="new-chat">New Chat</button>
                <a class="link" href="/dashboard/">Dashboard</a>
            </nav>
        </header>

        <main class="messages" id="messages"></main>

        <form class="composer" id="composer">
            <div class="attachments" id="attachments"></div>
            <div class="input-row">
                <button class="secondary" type="button" id="attach">Image</button>
                <textarea id="message" name="message" placeholder="Message Pebble" required></textarea>
                <button id="send" type="submit">Send</button>
            </div>
            <div class="status" id="status"></div>
            <input id="images" name="images" type="file" accept="image/*" multiple>
        </form>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('composer');
        const messageEl = document.getElementById('message');
        const statusEl = document.getElementById('status');
        const sendEl = document.getElementById('send');
        const imagesEl = document.getElementById('images');
        const attachEl = document.getElementById('attach');
        const attachmentsEl = document.getElementById('attachments');
        const newChatEl = document.getElementById('new-chat');

        let conversationId = localStorage.getItem('calorieConversationId') || '';

        function clearMessages() {
            messagesEl.textContent = '';
        }

        function addMessage(role, content) {
            const bubble = document.createElement('div');
            bubble.className = `message ${role}`;
            bubble.textContent = content;
            messagesEl.appendChild(bubble);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function renderMessages(messages) {
            clearMessages();
            if (!messages.length) {
                addMessage('assistant', 'Hi, I am ready.');
                return;
            }
            for (const item of messages) {
                addMessage(item.role, item.content);
            }
        }

        async function loadConversation() {
            if (!conversationId) {
                renderMessages([]);
                return;
            }

            try {
                const response = await fetch(`/agent/conversations/${encodeURIComponent(conversationId)}?profile=vidhi`);
                if (response.status === 404) {
                    localStorage.removeItem('calorieConversationId');
                    conversationId = '';
                    renderMessages([]);
                    return;
                }
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || `Request failed: ${response.status}`);
                }
                renderMessages(payload.messages || []);
            } catch (error) {
                renderMessages([]);
                statusEl.textContent = error.message;
            }
        }

        function renderAttachments() {
            const count = imagesEl.files.length;
            attachmentsEl.textContent = count ? `${count} image${count === 1 ? '' : 's'} attached for this message` : '';
        }

        function startNewChat() {
            conversationId = '';
            localStorage.removeItem('calorieConversationId');
            messageEl.value = '';
            imagesEl.value = '';
            renderAttachments();
            statusEl.textContent = '';
            renderMessages([]);
            messageEl.focus();
        }

        newChatEl.addEventListener('click', startNewChat);
        attachEl.addEventListener('click', () => imagesEl.click());
        imagesEl.addEventListener('change', renderAttachments);
        messageEl.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = messageEl.value.trim();
            if (!text) return;

            addMessage('user', text);
            statusEl.textContent = 'Thinking...';
            sendEl.disabled = true;

            const data = new FormData();
            data.append('message', text);
            data.append('profile', 'vidhi');
            if (conversationId) data.append('conversation_id', conversationId);
            for (const file of imagesEl.files) {
                data.append('images', file);
            }

            messageEl.value = '';
            imagesEl.value = '';
            renderAttachments();

            try {
                const response = await fetch('/agent/chat', {
                    method: 'POST',
                    body: data,
                });
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || `Request failed: ${response.status}`);
                }
                conversationId = payload.conversation_id;
                localStorage.setItem('calorieConversationId', conversationId);
                if (payload.messages && payload.messages.length) {
                    renderMessages(payload.messages);
                } else {
                    addMessage('assistant', payload.reply);
                }
                statusEl.textContent = '';
            } catch (error) {
                statusEl.textContent = error.message;
            } finally {
                sendEl.disabled = false;
                messageEl.focus();
            }
        });

        loadConversation();
    </script>
</body>
</html>
